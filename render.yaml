services:
  - type: web
    name: chaibook-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    healthCheckPath: /health
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      # Neon Postgres — pooled connection string
      - key: DATABASE_URL
        sync: false
      # Public URL of the Vercel frontend (both must be the same origin)
      - key: CLIENT_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: chaibook
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Inngest Cloud keys (leave unset only if you are not running background ingestion)
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
